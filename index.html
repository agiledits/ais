function typeBadge(type) {

// ============ GENERAL LEDGER COMPUTATION ============
function computeGeneralLedger() {
  const gl = {};
  data.chartOfAccounts.forEach(a => {
    gl[a.code] = {code:a.code, title:a.title, type:a.type, openingDr:0, openingCr:0, periodDr:0, periodCr:0};
  });
  
  // Opening balances from GJ-001
  data.generalJournal.filter(e => e.ref === 'GJ-001').forEach(e => {
    if (gl[e.acct]) {
      gl[e.acct].openingDr += e.dr;
      gl[e.acct].openingCr += e.cr;
    }
  });
  
  // Purchase Journal totals
  const pjTotals = data.purchaseJournal.reduce((s,e) => {
    s[e.acct] = (s[e.acct]||0) + (e.merch + e.other);
    s['1300'] = (s['1300']||0) + e.inputVAT;
    s['2000'] = (s['2000']||0) + e.ap;
    return s;
  }, {});
  
  // Cash Disbursement Journal totals
  const cdjTotals = data.cdj.reduce((s,e) => {
    s[e.acct] = (s[e.acct]||0) + e.ap;
    if (e.other > 0) {
      // find the account for other expense (use acct if ap=0)
      if (e.ap === 0) s[e.acct] = (s[e.acct]||0) + e.other;
    }
    s['1300'] = (s['1300']||0) + e.inputVAT;
    s['5300'] = (s['5300']||0) + e.pdisc;
    s['1010'] = (s['1010']||0) + e.cash; // cash out
    s['2300'] = (s['2300']||0) + e.ewt;
    return s;
  }, {});
  
  // Sales Journal totals
  const sjTotals = data.salesJournal.reduce((s,e) => {
    s['1100'] = (s['1100']||0) + e.ar;
    s['4000'] = (s['4000']||0) + e.sales;
    s['2100'] = (s['2100']||0) + e.outputVAT;
    s['5000'] = (s['5000']||0) + e.cogs;
    s['1200'] = (s['1200']||0) + e.inv;
    return s;
  }, {});
  
  // Cash Receipts Journal totals
  const crjTotals = data.crj.reduce((s,e) => {
    s['1010'] = (s['1010']||0) + e.cash; // cash in
    s['4200'] = (s['4200']||0) + e.sdisc;
    s['1100'] = (s['1100']||0) + e.ar;
    s['4000'] = (s['4000']||0) + e.sales;
    s['2100'] = (s['2100']||0) + e.outputVAT;
    s['4300'] = (s['4300']||0) + e.other;
    s['5000'] = (s['5000']||0) + e.cogs;
    s['1200'] = (s['1200']||0) + e.inv;
    return s;
  }, {});
  
  // General Journal (non-opening)
  const gjTotals = data.generalJournal.filter(e => e.ref !== 'GJ-001').reduce((s,e) => {
    s[e.acct] = s[e.acct] || {dr:0, cr:0};
    s[e.acct].dr += e.dr;
    s[e.acct].cr += e.cr;
    return s;
  }, {});
  
  // Now build period activity per account using the actual account debits/credits
  // We need a more precise approach - compute per-account period Dr and Cr
  
  // Reset
  Object.keys(gl).forEach(k => { gl[k].periodDr = 0; gl[k].periodCr = 0; });
  
  // Helper: add debit to account
  function addDr(code, amt) { if (gl[code]) gl[code].periodDr += amt; }
  function addCr(code, amt) { if (gl[code]) gl[code].periodCr += amt; }
  
  // Purchase Journal entries
  data.purchaseJournal.forEach(e => {
    addDr(e.acct, e.merch + e.other);
    addDr('1300', e.inputVAT);
    addCr('2000', e.ap);
  });
  
  // CDJ entries
  data.cdj.forEach(e => {
    if (e.ap > 0) addDr(e.acct, e.ap);
    if (e.other > 0 && e.ap === 0) addDr(e.acct, e.other);
    addDr('1300', e.inputVAT);
    addCr('5300', e.pdisc);
    addCr('1010', e.cash);
    addCr('2300', e.ewt);
  });
  
  // Sales Journal entries
  data.salesJournal.forEach(e => {
    addDr('1100', e.ar);
    addCr('4000', e.sales);
    addCr('2100', e.outputVAT);
    addDr('5000', e.cogs);
    addCr('1200', e.inv);
  });
  
  // CRJ entries
  data.crj.forEach(e => {
    addDr('1010', e.cash);
    addDr('4200', e.sdisc);
    addCr('1100', e.ar);
    addCr('4000', e.sales);
    addCr('2100', e.outputVAT);
    addCr('4300', e.other);
    addDr('5000', e.cogs);
    addCr('1200', e.inv);
  });
  
  // GJ non-opening
  data.generalJournal.filter(e => e.ref !== 'GJ-001').forEach(e => {
    addDr(e.acct, e.dr);
    addCr(e.acct, e.cr);
  });
  
  // Compute ending balances
  Object.values(gl).forEach(a => {
    const acct = getAccount(a.code);
    const netOpen = a.openingDr - a.openingCr;
    const netPeriod = a.periodDr - a.periodCr;
    const ending = netOpen + netPeriod;
    if (ending >= 0) { a.endingDr = ending; a.endingCr = 0; }
    else { a.endingDr = 0; a.endingCr = -ending; }
  });
  
  return gl;
}

function computeTrialBalance() {
  const gl = computeGeneralLedger();
  return Object.values(gl).filter(a => a.endingDr > 0 || a.endingCr > 0);
}

function computeIncomeStatement() {
  const gl = computeGeneralLedger();
  const accounts = Object.values(gl);
  const income = accounts.filter(a => a.type === 'Income');
  const expense = accounts.filter(a => a.type === 'Expense');
  
  const totalRevenue = income.reduce((s,a) => s + (a.endingCr - a.endingDr), 0);
  const totalExpenses = expense.reduce((s,a) => s + (a.endingDr - a.endingCr), 0);
  const netIncome = totalRevenue - totalExpenses;
  
  return { income, expense, totalRevenue, totalExpenses, netIncome };
}

// ============ BALANCE SHEET ============
function renderBS() {
  const gl = computeGeneralLedger();
  const accounts = Object.values(gl);
  const assets = accounts.filter(a => a.type.startsWith('Asset'));
  const liabilities = accounts.filter(a => a.type === 'Liability');
  const equity = accounts.filter(a => a.type.startsWith('Equity'));
  const is = computeIncomeStatement();
  
  const totalAssets = assets.reduce((s,a) => s + (a.endingDr - a.endingCr), 0);
  const totalLiabilities = liabilities.reduce((s,a) => s + (a.endingCr - a.endingDr), 0);
  const totalEquity = equity.reduce((s,a) => s + (a.endingCr - a.endingDr), 0) + is.netIncome;
  
  const renderGroup = (items, isContra=false) => items.filter(a => a.endingDr||a.endingCr).map(a => {
    const val = a.type.includes('Contra') ? (a.endingDr - a.endingCr) : (a.endingDr - a.endingCr);
    return `<div class="flex justify-between py-1 pl-4"><span>${a.title}</span><span class="font-mono">${fmt(Math.abs(val))}</span></div>`;
  }).join('');
  
  document.getElementById('content').innerHTML = `
    <div class="max-w-4xl mx-auto">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-8 border-b border-slate-200 text-center">
          <h3 class="text-xl font-bold text-slate-800">ABC TRADING CORP.</h3>
          <p class="text-sm text-slate-600 mt-1">STATEMENT OF FINANCIAL POSITION</p>
          <p class="text-xs text-slate-500">As of January 31, 2026</p>
          <p class="text-xs text-slate-400">(Amounts in Philippine Peso)</p>
        </div>
        <div class="p-8 text-sm">
          <div class="font-bold text-slate-700 mb-2">ASSETS</div>
          <div class="font-semibold text-xs text-slate-600 mt-2">Current Assets</div>
          ${renderGroup(assets.filter(a => ['1000','1010','1020','1100','1110','1200','1300','1400','1500'].includes(a.code)))}
          <div class="font-semibold text-xs text-slate-600 mt-3">Non-Current Assets</div>
          ${renderGroup(assets.filter(a => ['1600','1610'].includes(a.code)))}
          <div class="flex justify-between py-2 border-t-2 border-slate-400 font-bold mt-2">
            <span>TOTAL ASSETS</span>
            <span class="font-mono text-blue-700">${fmt(totalAssets)}</span>
          </div>
          
          <div class="font-bold text-slate-700 mb-2 mt-6">LIABILITIES</div>
          ${renderGroup(liabilities)}
          <div class="flex justify-between py-2 border-t border-slate-300 font-semibold mt-2">
            <span>Total Liabilities</span>
            <span class="font-mono">${fmt(totalLiabilities)}</span>
          </div>
          
          <div class="font-bold text-slate-700 mb-2 mt-4">EQUITY</div>
          ${renderGroup(equity)}
          <div class="flex justify-between py-1 pl-4"><span>Net Income for the Period</span><span class="font-mono">${fmt(is.netIncome)}</span></div>
          <div class="flex justify-between py-2 border-t border-slate-300 font-semibold mt-2">
            <span>Total Equity</span>
            <span class="font-mono">${fmt(totalEquity)}</span>
          </div>
          
          <div class="flex justify-between py-3 bg-gradient-to-r from-blue-50 to-indigo-50 px-4 rounded-lg mt-4 border-2 border-blue-600">
            <span class="text-lg font-bold">TOTAL LIABILITIES & EQUITY</span>
            <span class="font-mono text-lg font-bold text-blue-700">${fmt(totalLiabilities + totalEquity)}</span>
          </div>
          
          <div class="mt-4 text-center text-xs ${Math.abs(totalAssets - (totalLiabilities+totalEquity))<1?'text-green-600':'text-red-600'}">
            ${Math.abs(totalAssets - (totalLiabilities+totalEquity))<1 ? '✓ Balance Sheet is balanced' : '✗ Difference: ' + fmt(totalAssets - (totalLiabilities+totalEquity))}
          </div>
        </div>
      </div>
    </div>
  `;
}

// ============ EXPORT & MODAL ============
function closeModal() { document.getElementById('modal').classList.add('hidden'); }
function exportCSV() {
  let csv = '';
  if (currentModule === 'pj') csv = journalToCSV(data.purchaseJournal, ['date','ref','supplier','desc','acct','title','merch','other','inputVAT','ap','terms']);
  else if (currentModule === 'cdj') csv = journalToCSV(data.cdj, ['date','ref','payee','desc','acct','ap','other','inputVAT','pdisc','cash','ewt','bank']);
  else if (currentModule === 'sj') csv = journalToCSV(data.salesJournal, ['date','ref','customer','desc','terms','ar','sales','outputVAT','cogs','inv']);
  else if (currentModule === 'crj') csv = journalToCSV(data.crj, ['date','ref','from','desc','cash','sdisc','ar','sales','outputVAT','other','cogs','inv']);
  else if (currentModule === 'gj') csv = journalToCSV(data.generalJournal, ['date','ref','acct','title','desc','dr','cr']);
  else if (currentModule === 'coa') csv = journalToCSV(data.chartOfAccounts, ['code','title','type','normal','statement','description']);
  else if (currentModule === 'gl') {
    const gl = computeGeneralLedger();
    csv = journalToCSV(Object.values(gl), ['code','title','type','openingDr','openingCr','periodDr','periodCr','endingDr','endingCr']);
  } else if (currentModule === 'tb') {
    csv = journalToCSV(computeTrialBalance(), ['code','title','type','endingDr','endingCr']);
  } else {
    alert('Export available for journals, GL, and Trial Balance');
    return;
  }
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = currentModule + '_export.csv'; a.click();
}
function journalToCSV(arr, fields) {
  const header = fields.join(',') + '\n';
  const rows = arr.map(r => fields.map(f => {
    const v = r[f];
    return typeof v === 'string' && v.includes(',') ? `"${v}"` : (v ?? '');
  }).join(',')).join('\n');
  return header + rows;
}
